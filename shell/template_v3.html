<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F7F8F4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="XPDaily" />
<title>XPDaily — __NAME__</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@700&display=swap');
  :root{
    --paper:#F7F8F4; --ink:#101B2D; --flare:#FF4D29; --reef:#0E6BA8;
    --kelp:#0E8A5F; --haze:#7A8496; --line:#D9DDD3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
  .display{font-family:'Archivo Black','Arial Black',sans-serif;letter-spacing:-0.01em}
  .num{font-family:'Space Mono',ui-monospace,monospace;font-weight:700}
  button{font-family:inherit}
  button:focus-visible{outline:3px solid var(--reef);outline-offset:2px}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .hdr h1{font-size:26px;margin:0;cursor:pointer}
  .hdr .pen{color:var(--haze);font-size:13px;font-family:'Space Grotesk';font-weight:400}
  .score{text-align:right}
  .score .pts{font-size:24px;color:var(--flare);line-height:1}
  .score .lbl{font-size:11px;color:var(--haze);letter-spacing:.08em}
  .rail{display:flex;gap:5px;margin:16px 0 26px;align-items:center}
  .seg{height:10px;flex:1;border-radius:3px;background:#E4E7DF;border:1px solid var(--line)}
  .seg.speed{transform:skewX(-18deg)}
  .seg.teach{border-radius:99px}
  .seg.on{border-color:transparent}
  .seg.speed.on{background:var(--flare)}
  .seg.steady.on{background:var(--reef)}
  .seg.teach.on{background:var(--kelp)}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--haze)}
  .eyebrow.f{color:var(--flare);font-weight:700}
  .eyebrow.r{color:var(--reef);font-weight:700}
  .eyebrow.k{color:var(--kelp);font-weight:700}
  h2.big{font-size:40px;margin:10px 0 6px;line-height:1.05}
  h2.q{font-size:22px;font-weight:700;margin:0 0 16px}
  .opt{width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s ease,border-color .12s ease}
  .opt:active{transform:translateY(1px)}
  .opts{display:grid;gap:10px}
  .cta{background:var(--ink);color:var(--paper);font-size:18px;padding:15px 30px;border:none;border-radius:13px;cursor:pointer}
  .cta:disabled{background:#C9CEC4;cursor:not-allowed}
  .ghost{margin-top:12px;background:transparent;border:none;color:var(--haze);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px;display:block}
  .flash{margin-top:16px;padding:12px 16px;border-radius:12px;font-weight:600}
  .flash.ok{background:#E8F4EE;border:2px solid var(--kelp)}
  .flash.bad{background:#FCEBE6;border:2px solid var(--flare)}
  .flash.skip{background:#EEF1EA;border:2px solid var(--line);color:var(--haze)}
  .fusewrap{height:8px;background:#E4E7DF;border-radius:99px;overflow:hidden;margin-bottom:20px}
  .fuse{height:100%;background:var(--ink);border-radius:99px;transition:width .1s linear}
  .fuse.hot{background:var(--flare)}
  .conf{display:flex;gap:8px}
  .chip{padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink)}
  .chip.onc{border-color:var(--reef);background:var(--reef);color:#fff}
  .cards{display:flex;gap:10px;margin-bottom:18px}
  .card{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .flags{border-left:4px solid var(--flare);padding-left:12px;margin-bottom:18px}
  .flags p{margin:4px 0;font-size:15px}
  textarea{width:100%;padding:14px;font-size:16px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;resize:vertical}
  .deal{border-top:2px dashed var(--line);padding-top:14px;margin-bottom:20px;font-size:14px;color:var(--haze)}
  .note{font-size:14px;color:var(--haze)}
  .box{border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin-top:12px}
  .sendstat{margin:0 0 14px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px}
  .sendstat.wait{background:#EEF1EA;border:2px solid var(--line);color:var(--haze)}
  .sendstat.good{background:#E8F4EE;border:2px solid var(--kelp)}
  .sendstat.fail{background:#FCEBE6;border:2px solid var(--flare)}
  /* ── EVENT LAYER (data-driven off the set's tag — dormant on standard nights) ──
     Signature: the intro banner runs INVERTED (ink plate on the paper page) — the
     visual pun IS the mechanic on reversed nights. --bolt is event-only: chips,
     borders, dark-plate accents. Never body text on paper (contrast). */
  :root{ --bolt:#FFB800; --boltdeep:#8A5A00; --claim:#0E8A5F; --claimdeep:#0A5C40 }
  .evtchip{display:inline-flex;align-items:center;gap:5px;font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--boltdeep);background:#FFF3D6;border:2px solid var(--bolt);border-radius:99px;padding:3px 9px;margin-top:6px;animation:chipPulse 2.4s ease-in-out infinite}
  @keyframes chipPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,184,0,.45)}50%{box-shadow:0 0 0 6px rgba(255,184,0,0)}}
  .evtbanner{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 18px 20px;margin:10px 0 16px;position:relative;overflow:hidden}
  .evtbanner .bT{font-family:'Archivo Black','Arial Black',sans-serif;font-size:21px;letter-spacing:.01em;line-height:1.12}
  .evtbanner .bS{font-size:14px;margin-top:7px;color:#E9EBE4}
  .evtbanner .bS b{color:var(--bolt)}
  .evtbanner .charge{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--bolt),#FFE08A,var(--bolt));background-size:200% 100%;animation:charge 1.6s linear infinite}
  @keyframes charge{0%{background-position:0 0}100%{background-position:200% 0}}
  .revtag{display:inline-block;font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--boltdeep);background:#FFF3D6;border:1.5px solid var(--bolt);border-radius:6px;padding:2px 7px;margin-bottom:8px}
  /* Blitz finish HERO — the doubled number is the whole point of the night, so it leads. */
  .bhero{margin:6px 0 18px}
  .bhero .cap{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--boltdeep);background:#FFF3D6;border:2px solid var(--bolt);border-radius:99px;padding:4px 11px;margin-bottom:10px}
  .bhero .huge{font-family:'Archivo Black','Arial Black',sans-serif;letter-spacing:-0.02em;font-size:72px;line-height:.9;background:linear-gradient(135deg,var(--bolt) 0%,var(--flare) 115%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--flare);filter:drop-shadow(0 3px 10px rgba(255,138,41,.35));animation:heroPop .55s cubic-bezier(.2,1.3,.4,1) both}
  .bhero .src{font-size:15px;color:var(--haze);margin-top:6px}
  .bhero .src b{color:var(--boltdeep);font-weight:700}
  @keyframes heroPop{0%{opacity:0;transform:scale(.82)}60%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}

  /* ─────────── BATTLEGROUND LAYER (Friday) ───────────
     A territory claim skinned over the existing steady flow. Display-only: the bar
     is driven off the records the shell already keeps, never off score/timing. */
  .bgbanner{background:linear-gradient(135deg,#0A2A20,#0E1B2D);color:#F7F8F4;border-radius:14px;padding:16px 18px 20px;margin:10px 0 16px;position:relative;overflow:hidden;border:1px solid #1E5C46}
  .bgbanner .bT{font-family:'Archivo Black','Arial Black',sans-serif;font-size:21px;letter-spacing:.01em;line-height:1.12}
  .bgbanner .bS{font-size:14px;margin-top:7px;color:#D6EDE4}
  .bgbanner .bS b{color:#4FD6A0}
  .bgbanner .frontline{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--claim),#FFB800,var(--claim));background-size:200% 100%;animation:charge 2.2s linear infinite}
  /* the territory bar — fills LEFT-TO-RIGHT as you claim ground */
  .terrbar{margin:2px 0 18px;border:2px solid var(--claimdeep);border-radius:12px;padding:9px 11px;background:#07211A}
  .terrbar .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .terrbar .nm{font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:12px;letter-spacing:.06em;color:#4FD6A0}
  .terrbar .st{font-size:11px;color:#7FB8A4;letter-spacing:.08em}
  .terrbar .track{height:16px;border-radius:99px;background:#123A2E;overflow:hidden;position:relative}
  .terrbar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--claimdeep),var(--claim) 60%,#FFB800);width:0%;transition:width .55s cubic-bezier(.3,.9,.4,1)}
  .terrbar.claim .track{animation:claimflash 360ms ease-out}
  .terrbar.claim .fill{filter:brightness(1.35)}
  @keyframes claimflash{0%,100%{transform:translateX(0)}30%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
  .terrbar.contested .track{animation:contested 420ms ease-out}
  @keyframes contested{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 3px rgba(127,184,164,.4)}}
  .atktag{display:inline-block;font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:11px;letter-spacing:.1em;color:#4FD6A0;background:#0A2A20;border:1.5px solid var(--claimdeep);border-radius:6px;padding:2px 7px;margin-bottom:8px}
  .claimverdict{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--claimdeep);background:#E4F5EE;border:2px solid var(--claim);border-radius:99px;padding:4px 11px;margin-bottom:10px}
  body.evt-battleground .seg.steady.on{background:var(--claim)}
  /* run-local achievement unlocks on the finish screen (the immediate dopamine moment) */
  .badges{margin:2px 0 16px;display:flex;flex-direction:column;gap:8px}
  .badge{display:flex;align-items:center;gap:12px;border:2px solid var(--bolt);background:linear-gradient(135deg,#FFF9EB,#FFF3D6);border-radius:12px;padding:10px 13px;animation:badgePop .5s cubic-bezier(.2,1.25,.4,1) both}
  .badge .bic{font-size:26px;line-height:1;flex:0 0 auto}
  .badge .bnm{font-family:'Archivo Black','Arial Black',sans-serif;font-size:14px;color:var(--boltdeep);letter-spacing:.01em}
  .badge .bds{font-size:12.5px;color:var(--haze);margin-top:1px}
  .badge .unl{margin-left:auto;font-family:'Space Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;color:var(--boltdeep);opacity:.75}
  @keyframes badgePop{0%{opacity:0;transform:translateY(8px) scale(.94)}60%{opacity:1;transform:translateY(0) scale(1.02)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){
    .bgbanner .frontline{animation:none !important}
    .terrbar.claim .track,.terrbar.contested .track{animation:none !important}
    .terrbar .fill{transition:width .2s linear !important}
    .badge{animation:none !important}
  }
  body.evt-blitz .seg.speed.on{background:var(--bolt)}

  /* ─────────── FX LAYER (baseline juice, all nights) ───────────
     Pure CSS transforms/opacity — GPU-cheap, no libraries, no DOM churn beyond a
     small pooled overlay. Every effect DECORATES; none gates input or touches the
     clock. All of it is killed/softened under prefers-reduced-motion below. */
  #fxroot{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .fxparticle{position:absolute;width:13px;height:13px;border-radius:3px;will-change:transform,opacity;opacity:0}
  .fxrun{animation:fxfly var(--fxdur,720ms) cubic-bezier(.15,.6,.35,1) forwards}
  @keyframes fxfly{
    0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(var(--fxdx),var(--fxdy)) scale(.4) rotate(var(--fxrot))}
  }
  .fxpop{position:absolute;font-family:'Archivo Black','Arial Black',sans-serif;font-size:34px;letter-spacing:-.01em;will-change:transform,opacity;opacity:0;white-space:nowrap;text-shadow:0 2px 8px rgba(16,27,45,.18)}
  .fxpop.run{animation:fxpop 900ms cubic-bezier(.2,1.1,.35,1) forwards}
  @keyframes fxpop{0%{opacity:0;transform:translate(-50%,0) scale(.7)}25%{opacity:1;transform:translate(-50%,-14px) scale(1.08)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
  .fxflash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 42%,var(--fxflashc,rgba(255,184,0,.5)),transparent 60%)}
  .fxflash.run{animation:fxflash 520ms ease-out forwards}
  @keyframes fxflash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  /* screen kick — tiered by combo. shake is the classic motion-sickness trigger,
     so it is the FIRST thing reduced-motion removes. */
  .kick1{animation:kick1 300ms ease-out}
  .kick2{animation:kick2 380ms cubic-bezier(.36,.07,.19,.97)}
  .kick3{animation:kick3 460ms cubic-bezier(.36,.07,.19,.97)}
  @keyframes kick1{0%,100%{transform:translate(0,0)}30%{transform:translate(-2px,-4px)}60%{transform:translate(2px,-1px)}}
  @keyframes kick2{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,2px)}45%{transform:translate(8px,-2px)}70%{transform:translate(-4px,1px)}}
  @keyframes kick3{0%,100%{transform:translate(0,0)}12%{transform:translate(-12px,4px)}28%{transform:translate(14px,-4px)}45%{transform:translate(-10px,2px)}62%{transform:translate(10px,-2px)}80%{transform:translate(-4px,0)}}
  @media (prefers-reduced-motion: reduce){
    .fuse,.opt{transition:none !important}
    .evtbanner .charge,.evtchip{animation:none !important}
    .bhero .huge{animation:none !important}
    /* FX: no shake at all; particles/flash suppressed; number pop keeps a gentle fade only */
    .kick1,.kick2,.kick3{animation:none !important}
    .fxrun,.fxflash.run{animation:none !important;opacity:0 !important}
    .fxpop.run{animation:fxpopRM 700ms ease-out forwards !important}
    @keyframes fxpopRM{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
  }
  @media (prefers-reduced-motion: reduce){ .fuse,.opt{transition:none !important} .evtbanner .charge,.evtchip{animation:none !important} .bhero .huge{animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1 class="display" id="appName">XPDaily<span class="pen"> ✎</span></h1>
    <div class="score"><div class="num pts" id="pts">0</div><div class="lbl">POINTS</div><div id="evtChip"></div></div>
  </div>
  <div class="rail" id="rail"></div>
  <div id="stage"></div>
</div>
<div id="fxroot" aria-hidden="true"></div>

<script>
// ─────────────────────────────────────────────
// DailyXP — SHELL v3.0 · the permanent shell
// This file no longer contains questions. It is deployed ONCE per boy
// and never redeployed for content. Changes from H1.7:
//  · questions fetched from GitHub (y9.json / y8.json) at load —
//    day/date/title now come from the data, killing stale-label bugs
//  · TIMING REBUILT: single clock discipline — a question's clock
//    starts when it renders, stops when it's answered/locked/sent.
//    active = sum of question clocks, elapsed = wall clock,
//    idle = the gap. Invariant active ≤ elapsed now holds by
//    construction (the old qStart never reset between speed
//    questions, so each question absorbed all time before it).
//  · AUTO-SUBMIT on finish: full results POST to the family results
//    Sheet the moment the run ends. Offline-safe: unsent results
//    queue on the phone and auto-send next open. Backup email
//    and copy remain as backups.
//  · attempts / custom app name persist per boy (namespaced keys)
//  · all game mechanics, scoring, and flag logic unchanged from H1.7
//  · v3.0.5 EVENT LAYER: presentation only, driven by the set's tag —
//    Blitz banner + ×2 week-tally chip + finish arithmetic, REVERSED
//    speed styling. SCORING IS NEVER TOUCHED BY EVENTS: the ×2 lives
//    at the family deal layer (weekly tally — SEASONS.md); the shell
//    advertises the deal and shows the sum. Detection is TAG-ONLY so
//    a warm-up played on a Wednesday can never promise ×2 falsely.
// ─────────────────────────────────────────────
var CONFIG = {
  STUDENT: "__STUDENT__",   // student code (name lives in the private roster, never here)
  NAME: "__NAME__",
  QUESTIONS_URL: "https://raw.githubusercontent.com/Rich898/DailyXP-content/main/__STUDENT__.json",
  WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbyqm-ejLSDP9F7wCjZCgx4E0Ugh285GJf7AjmH5TBeRJ44OTFI6H-CwJ2Gx7ZyE5f-mEQ/exec",
  SUPABASE_URL: "https://ftknumgdmalxyjxvqlux.supabase.co",
  SUPABASE_ANON: "sb_publishable_02mBzFnvRg5fZFrzq3w3pg_xXzVK7KF",
  SHELL_VERSION: "3.0.5"
};

var SPEED_SECONDS = 30;
var SPEED_BASE=100, TIME_BONUS=3, COMBO_BONUS=50, STEADY_POINTS=250, TEACH_POINTS=150;

// Filled by loadQuiz() from the fetched JSON:
var QUIZ=null, QUESTIONS=[], speedQs=[], steadyQs=[], teachQ=null, MAX_SCORE=0, shuffled={};

var state = { screen:"loading", idx:0, score:0, combo:0, records:[], picked:null, confidence:null, locked:false, appName:"XPDaily", sending:false, sent:false };
var timer=null, tStart=0, answeredThis=false;
var lastPayload=null;

/*EVENT-CORE-START*/
// Event layer — pure functions, testable by extraction (mirrors TIMING-CORE).
// Detection is TAG-ONLY, deliberately stricter than achievements.py's lenient
// (day=="WED" or BLITZ-in-tag): the shell PROMISES ×2 on screen, and a warm-up
// or makeup set played on a Wednesday must never make that promise falsely.
// run_daily stamps the tag deterministically — the tag is the carrier of truth.
// Events never touch scoring: the ×2 is applied at the family deal layer
// (weekly tally — SEASONS.md). blitzTally() is display arithmetic only.
function eventModeFor(tag){
  tag = String(tag||"");
  if(/REVERSED/i.test(tag)) return "reversed-blitz";
  if(/BLITZ/i.test(tag)) return "blitz";
  if(/BATTLEGROUND/i.test(tag)) return "battleground";   // Friday event
  return "";
}
function isBlitz(mode){ return mode==="blitz" || mode==="reversed-blitz"; }
function blitzTally(score){ return (Number(score||0)*2).toLocaleString(); }
/*EVENT-CORE-END*/
var EVENT = "";
function applyEvent(){
  EVENT = eventModeFor(QUIZ && QUIZ.tag);
  document.body.className = isBlitz(EVENT) ? "evt-blitz" : (EVENT==="battleground" ? "evt-battleground" : "");
  var c = el("evtChip");
  if(c) c.innerHTML = isBlitz(EVENT) ? '<span class="evtchip">\u26a1 \u00d72 WEEK TALLY</span>' : "";
}

/*FX-CORE-START*/
// FX layer — pure decoration. HARD CONTRACT (proven by test_fx.js):
//   · never reads or writes game state, score, combo, records, or timing
//   · never gates input — it only spawns transient nodes / toggles a class
//   · pooled + capped (particles cleaned up on animationend; hard MAX)
//   · fully governed by prefers-reduced-motion (shake off, particles off,
//     number-pop degrades to a gentle fade — see the CSS media query)
// The rest of the shell calls fx.celebrate(...) at the "correct" moments; that is
// the ONLY coupling. Palette is passed in so the blitz/boss overlays can tint it.
function makeFX(opts){
  opts = opts || {};
  var doc = opts.document || (typeof document!=="undefined"?document:null);
  var reduce = opts.reduceMotion || function(){
    try{ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch(e){ return false; }
  };
  var MAX_PARTICLES = 60;          // hard cap — protects weak phones from unbounded emitters (doubled with the effect tiers)
  var live = 0;
  function root(){ return doc && doc.getElementById("fxroot"); }
  function target(){ return doc && (doc.querySelector(".wrap") || doc.body); }

  function burst(x, y, colors, n){
    var r = root(); if(!r || reduce()) return 0;
    n = Math.min(n||14, MAX_PARTICLES - live); if(n<=0) return 0;
    for(var i=0;i<n;i++){
      var p = doc.createElement("div"); p.className = "fxparticle";
      var ang = Math.random()*Math.PI*2, dist = 80 + Math.random()*150;
      p.style.left = x+"px"; p.style.top = y+"px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--fxdx", Math.cos(ang)*dist + "px");
      p.style.setProperty("--fxdy", (Math.sin(ang)*dist + 30) + "px"); // slight gravity
      p.style.setProperty("--fxrot", (Math.random()*540-270)+"deg");
      p.style.setProperty("--fxdur", (560 + Math.random()*260)+"ms");
      r.appendChild(p); live++;
      void p.offsetWidth; p.classList.add("fxrun");   // reflow so anim starts from origin
      (function(node){
        var done=function(){ if(node.parentNode){ node.parentNode.removeChild(node); live--; } };
        node.addEventListener("animationend", done, {once:true});
        setTimeout(done, 1100); // belt-and-braces cleanup if animationend is missed
      })(p);
    }
    return n;
  }
  function flash(color){
    var r = root(); if(!r || reduce()) return false;
    var f = doc.createElement("div"); f.className = "fxflash";
    if(color) f.style.setProperty("--fxflashc", color);
    r.appendChild(f); void f.offsetWidth; f.classList.add("run");
    f.addEventListener("animationend", function(){ if(f.parentNode) f.parentNode.removeChild(f); }, {once:true});
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 700);
    return true;
  }
  function popNumber(x, y, text, color){

// Battleground layer — a territory claim skinned over the steady flow. HARD CONTRACT
// (proven by test_battleground.js): the territory model is DISPLAY-ONLY, a pure function
// of the steady records — it never writes score/combo/records/timing. There is NO win/lose:
// the result is simply how much ground you claimed (0-100%). A miss leaves ground CONTESTED,
// never a failure — a struggling kid can't "lose" their own weak spots. The % is honest
// progress, and every Friday is a fresh, self-contained shot at claiming this week's ground.
function makeBattleground(){
  var W = 1, REPAIR_W = 1.4;   // repair zones are the harder ground -> worth a bigger share
  function weight(r){ return (r && r.repair) ? REPAIR_W : W; }
  // total ground available across all zones (from the steady question set)
  function totalGround(zones){
    var t = 0; (zones||[]).forEach(function(q){ t += weight(q); }); return t || 1;
  }
  // ground claimed so far = weight of every zone answered correctly (from records)
  function claimedGround(recs){
    var c = 0;
    (recs||[]).forEach(function(r){
      if(r && r.phase==="steady" && r.ok && !r.skipped){ c += weight(r); }
    });
    return c;
  }
  // % of the battleground claimed — 0 to 100, order-independent, pure.
  function pct(recs, zones){ return Math.round(claimedGround(recs) / totalGround(zones) * 100); }
  // how the claim reads at the finish — never a "loss", just how much ground you took.
  function tier(p){
    if(p >= 100) return "total";      // the whole field
    if(p >= 75)  return "strong";
    if(p >= 40)  return "solid";
    if(p > 0)    return "foothold";
    return "held";                    // 0% — you held the line; take it next week
  }
  return { W:W, REPAIR_W:REPAIR_W, totalGround:totalGround, claimedGround:claimedGround, pct:pct, tier:tier,
           canLose:function(){ return false; } };   // no lose-condition, by design
}

/*TIMING-CORE-START*/
// Single source of truth for time. A question's clock starts when it is
// shown (once — re-renders of the same question don't restart it) and
// stops when it is answered / locked / submitted. Reveal-reading and
// between-question pauses are idle by design.
function makeTiming(now){
  now = now || function(){ return Date.now(); };
  var t = { sessionStart:0, qStart:null, activeMs:0,
            phaseMs:{speed:0,steady:0,teach:0}, perQ:[] };
  return {
    startSession: function(){
      t.sessionStart = now(); t.qStart = null; t.activeMs = 0;
      t.phaseMs = {speed:0,steady:0,teach:0}; t.perQ = [];
    },
    questionShown: function(){ t.qStart = now(); },
    questionDone: function(id, subject, phase, extra){
      if(t.qStart === null) return null;        // double-fire safe: no open clock, no time booked
      var ms = now() - t.qStart; t.qStart = null;
      t.activeMs += ms;
      if(t.phaseMs[phase] !== undefined) t.phaseMs[phase] += ms;
      var rec = { id:id, subject:subject, phase:phase, secs:+(ms/1000).toFixed(1) };
      if(extra){ for(var k in extra){ rec[k]=extra[k]; } }
      t.perQ.push(rec);
      return rec;
    },
    summary: function(){
      var elapsedMs = now() - t.sessionStart;
      var activeMs = Math.min(t.activeMs, elapsedMs); // defence vs device-clock jumps only
      return {
        elapsedSecs:+(elapsedMs/1000).toFixed(1),
        activeSecs:+(activeMs/1000).toFixed(1),
        idleSecs:+(Math.max(0,elapsedMs-activeMs)/1000).toFixed(1),
        phases:{
          speed:+(t.phaseMs.speed/1000).toFixed(1),
          steady:+(t.phaseMs.steady/1000).toFixed(1),
          teach:+(t.phaseMs.teach/1000).toFixed(1)
        },
        perQuestion: t.perQ.slice()
      };
    },
    _raw: function(){ return { activeMs:t.activeMs, sessionStart:t.sessionStart }; }
  };
}

function pickSteady(btn){ if(state.locked) return; state.picked=btn.getAttribute("data-v"); renderSteady(); }

function lockSteady(){
  if(!state.picked||!state.confidence||state.locked) return;

  T.questionDone(q.id,q.subject,"steady",{ok:ok,confidence:state.confidence});

  state.records.push({id:q.id,subject:q.subject,phase:"steady",picked:state.picked,ok:ok,confidence:state.confidence,repair:!!q.repair,pts:ok?STEADY_POINTS:0});
  if(EVENT==="battleground"){ claimBeat(ok); }              // decoration; records already committed above
  else if(ok) FX.celebrate(fxSpec(2, STEADY_POINTS)); // baseline/blitz steady win

}
// Claim feedback: a claimed zone advances the bar + a claim burst; a miss leaves the zone
// contested (a muted beat, ground unchanged). Never a lose-condition — the % is honest progress.
function claimBeat(hit){
  // renderSteady re-renders with the new HP; drive the animation classes + FX just after.
  setTimeout(function(){
    var bar = el("terrbar"); var pal = fxPalette();
    if(hit){
      if(bar){ bar.className = "terrbar claim"; }
      FX.burst( (el("fxroot")?el("fxroot").clientWidth:360)/2, 150, pal.spark, 22); FX.kick(2);
    } else {
      if(bar){ bar.className = "terrbar contested"; }
      FX.flash("rgba(127,184,164,.35)"); FX.kick(2);   // ground stays contested (no penalty)
    }
  }, 40);
}
function skipSteady(){

// The teach-back is the highest-value question, so its submit gate checks for a genuine
// ATTEMPT — not just length. This is the EFFORT layer only: it stops keyboard-mashing,
// single-word repetition and clearly-non-English text from getting the tick. It stays
// PERMISSIVE (a real English attempt of any quality passes) because the true QUALITY +
// correctness + language judgement is the server-side LLM grade, which reads the explanation
// and decides whether the topic actually advances. The client cannot judge that (no AI here).
var TB_COMMON = ["the","a","an","is","are","was","were","be","been","to","of","and","or","but",
  "in","on","for","it","its","that","this","these","those","they","you","we","he","she","them",
  "because","so","if","when","how","why","what","which","with","as","at","by","not","no","do",
  "does","did","can","could","will","would","should","have","has","had","there","then","from",
  "into","about","more","than","some","all","each","also","their","your","our","get","got","make"];
function teachbackReady(v){
  v = (v||"").trim();
  if(v.length < 80) return {ok:false, hint:"Keep going \u2014 a few full sentences."};
  var words = v.split(/\s+/).filter(function(w){ return w.replace(/[^A-Za-z]/g,"").length >= 2; });
  if(words.length < 12) return {ok:false, hint:"Explain it in your own words \u2014 a few full sentences."};
  var lower = {}; words.forEach(function(w){ var c=w.toLowerCase().replace(/[^a-z]/g,""); if(c) lower[c]=1; });
  if(Object.keys(lower).length < 6) return {ok:false, hint:"Say it properly \u2014 real sentences, not one word repeated."};
  var chars = {}; v.toLowerCase().replace(/[^a-z]/g,"").split("").forEach(function(c){ chars[c]=1; });
  if(Object.keys(chars).length < 10) return {ok:false, hint:"That doesn\u2019t look like a real answer yet."};
  var common = 0; for(var w in lower){ if(TB_COMMON.indexOf(w) >= 0) common++; }
  if(common < 2) return {ok:false, hint:"Write it out in full English sentences."};
  return {ok:true, hint:""};
}
function tbInput(){
  var v=el("tb").value.trim();
  var r=teachbackReady(v);
  var wc = v ? v.split(/\s+/).filter(Boolean).length : 0;
  el("tbCount").textContent = r.ok ? (wc+" words \u2713") : r.hint;
  el("tbCount").style.color = r.ok ? "var(--kelp)" : "var(--haze)";
  el("tbBtn").disabled = !r.ok;
}
function finishTeach(){
  var v=el("tb").value.trim(); if(!teachbackReady(v).ok) return;
  T.questionDone(teachQ.id,teachQ.subject,"teach",{ok:true,chars:v.length});
  state.score+=TEACH_POINTS; setScore();
  state.records.push({id:teachQ.id,subject:teachQ.subject,phase:"teach",text:v,ok:true,pts:TEACH_POINTS});
  if(EVENT==="battleground"){
    // the kill shot: empty the still-visible HP bar, fire the showpiece, THEN reveal victory.
    var bar=el("terrbar"); if(bar) bar.className="terrbar claim";
    FX.showpiece(fxPalette());
    setTimeout(function(){ state.screen="done"; render(); }, 780);   // let the secure beat land
    return;
  }
  state.screen="done"; render();
}

// ── flag logic ─────────────────────────────
// fast-but-wrong is relative to HIS OWN pace, not a fixed number.
// slow-but-wrong: worked at it, came up empty.
function analyse(){
  var speedRecs=state.records.filter(function(r){return r.phase==="speed" && !r.skipped});
  var corrects=speedRecs.filter(function(r){return r.ok});
  var mean = corrects.length>=2
    ? corrects.reduce(function(a,r){return a+r.timeUsed},0)/corrects.length
    : null;
  var fastCut = mean!==null ? mean*0.7 : 5;
  var slowCut = SPEED_SECONDS*0.6; // 18s of a 30s window
  return {
    speedRecs: speedRecs,
    fast: speedRecs.filter(function(r){return !r.ok && r.timeUsed < fastCut}),
    slow: speedRecs.filter(function(r){return !r.ok && r.timeUsed >= slowCut})
  };
}

function flagSets(){
  var a=analyse();
  var steadyRecs=state.records.filter(function(r){return r.phase==="steady"});
  return {
    a: a,
    skips: state.records.filter(function(r){return r.skipped}),
    cw: steadyRecs.filter(function(r){return !r.ok&&!r.skipped&&r.confidence==="Sure"}),
    lg: steadyRecs.filter(function(r){return r.ok&&r.confidence==="Guessing"})
  };
}

function summaryText(){
  var f=flagSets(); var a=f.a;
  var speedAll=state.records.filter(function(r){return r.phase==="speed"});
  var steadyRecs=state.records.filter(function(r){return r.phase==="steady"});
  var L=[];
  L.push(state.appName+" · "+CONFIG.NAME.toUpperCase()+" · "+quizLabel()+(QUIZ&&QUIZ.tag?" · "+QUIZ.tag:"")+" · shell v"+CONFIG.SHELL_VERSION);
  var tm=T.summary();
  L.push("Active time "+fmtMMSS(tm.activeSecs)+"  (speed "+fmtMMSS(tm.phases.speed)+" · steady "+fmtMMSS(tm.phases.steady)+" · teach-back "+fmtMMSS(tm.phases.teach)+")");
  L.push("Elapsed "+fmtMMSS(tm.elapsedSecs)+(tm.idleSecs>90 ? "  (incl. "+fmtMMSS(tm.idleSecs)+" paused/away)" : "")+(tm.activeSecs>20*60 ? "  ⚠ 20+ active min — worth trimming" : ""));
  var _d=_todayStr(); var _today=(ATTEMPTS.byDay&&ATTEMPTS.byDay[_d])||1; var _first=(ATTEMPTS.firstOfDay&&ATTEMPTS.firstOfDay[_d])||"";
  L.push("Attempt "+_today+" today"+(_today>1?"  (⚠ repeat run — first was "+_first+"; first run is the honest one)":"")+"  · "+(ATTEMPTS.total||1)+" all-time");
  L.push("Score "+state.score.toLocaleString()+" / "+MAX_SCORE.toLocaleString()+" · Speed "+speedAll.filter(function(r){return r.ok}).length+"/"+speedQs.length+" · Steady "+steadyRecs.filter(function(r){return r.ok}).length+"/"+steadyQs.length+" · Teach-back done");
  if(f.skips.length) L.push("NOT COVERED IN CLASS YET: "+f.skips.map(function(r){return r.subject+" "+r.id}).join(", "));
  if(f.cw.length) L.push("CONFIDENT-BUT-WRONG: "+f.cw.map(function(r){return r.subject+" "+r.id}).join(", "));
  if(a.slow.length) L.push("SLOW-BUT-WRONG (real gap): "+a.slow.map(function(r){return r.subject+" "+r.id}).join(", "));
  if(a.fast.length) L.push("FAST-BUT-WRONG (rushed): "+a.fast.map(function(r){return r.subject+" "+r.id}).join(", "));
  if(f.lg.length) L.push("LUCKY GUESSES: "+f.lg.map(function(r){return r.subject+" "+r.id}).join(", "));
  L.push("—");
  state.records.forEach(function(r){
    if(r.phase==="teach") return;
    if(r.skipped){ L.push(r.id+" "+r.subject+" — skipped (not covered yet)"); return; }
    L.push(r.id+" "+r.subject+" "+(r.ok?"✓":"✗")+(r.phase==="speed"?(" "+r.timeUsed+"s"):(" · felt: "+r.confidence))+(r.picked===null?" (no answer)":""));
  });
  var tb=state.records.filter(function(r){return r.phase==="teach"})[0];
  if(tb) L.push('Teach-back ('+tb.subject+'): "'+tb.text+'"');
  return L.join("\n");
}

// ── auto-submit to the family results Sheet ──
function buildPayload(){
  var f=flagSets(); var a=f.a;
  var speedAll=state.records.filter(function(r){return r.phase==="speed"});
  var steadyRecs=state.records.filter(function(r){return r.phase==="steady"});
  var tb=state.records.filter(function(r){return r.phase==="teach"})[0];
  var _d=_todayStr();
  return {
    shell: CONFIG.SHELL_VERSION,
    student: CONFIG.STUDENT,
    name: CONFIG.NAME,
    date: (QUIZ&&QUIZ.date)||_d,       // the quiz's date
    day: (QUIZ&&QUIZ.day)||"",
    tag: (QUIZ&&QUIZ.tag)||"",
    deviceDate: _d,                     // the date it was actually run
    ts: new Date().toISOString(),
    attempt: (ATTEMPTS.byDay&&ATTEMPTS.byDay[_d])||1,
    attemptsAllTime: ATTEMPTS.total||1,
    score: state.score,
    maxScore: MAX_SCORE,
    speed: { right: speedAll.filter(function(r){return r.ok}).length, of: speedQs.length },
    steady: { right: steadyRecs.filter(function(r){return r.ok}).length, of: steadyQs.length },
    teach: tb ? { done:true, chars: tb.text.length, text: tb.text } : { done:false },
    flags: {
      skips: f.skips.map(function(r){return r.id}),
      confidentWrong: f.cw.map(function(r){return r.id}),
      slowWrong: a.slow.map(function(r){return r.id}),
      fastWrong: a.fast.map(function(r){return r.id}),
      luckyGuess: f.lg.map(function(r){return r.id})
    },
    records: state.records,
    timing: T.summary(),
    summaryText: summaryText()
  };
}
function sendPayload(p, cb){
  // Dual-write (fire-and-forget): mirror the result into Supabase. The Sheet
  // below stays the source of truth and owns the callback — this second write
  // can never block or fail the submission. New API-key mode: role is carried
  // by the apikey header, so no Authorization/Bearer header is sent.
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON) {
    try {
      fetch(CONFIG.SUPABASE_URL + "/rest/v1/runs_raw", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": CONFIG.SUPABASE_ANON,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ payload: p })
      }).catch(function(){});
    } catch (e) {}
  }
  var ctl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  var to = ctl ? setTimeout(function(){ ctl.abort(); }, 12000) : null;
  fetch(CONFIG.WEBHOOK_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(p),
    signal: ctl ? ctl.signal : undefined
  })
  .then(function(r){ return r.json(); })
  .then(function(j){ if(to) clearTimeout(to); cb(!!(j && j.ok)); })
  .catch(function(e){ if(to) clearTimeout(to); cb(false); });
}
function readOutbox(){ try{ return JSON.parse(window.localStorage.getItem(OUTBOX_KEY)||"[]"); }catch(e){ return []; } }
function writeOutbox(a){ try{ window.localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); }catch(e){} }
function flushOutbox(){
  var a=readOutbox(); if(!a.length) return;
  var p=a[0];
  sendPayload(p, function(ok){
    if(ok){ a.shift(); writeOutbox(a); if(a.length) flushOutbox(); }
  });
}
function setSendStat(mode){
  var s=el("sendStat"); if(!s) return;
  if(mode==="send"){ s.className="sendstat wait"; s.innerHTML="⏳ Uploading to the Vault…"; }
  else if(mode==="ok"){ s.className="sendstat good"; s.innerHTML="✓ You're done — results uploaded to the Vault."; }
  else { s.className="sendstat fail"; s.innerHTML="⚠ Couldn\'t send (no internet?). Saved on this phone — it\'ll auto-send next time you open this. <a href=\"#\" onclick=\"retrySend();return false;\" style=\"color:var(--reef)\">Try again now</a>"; }
}
function autoSubmit(){
  if(state.sent || state.sending) return;
  state.sending=true; setSendStat("send");
  lastPayload = buildPayload();
  var p = lastPayload;
  sendPayload(p, function(ok){
    state.sending=false;
    if(ok){ state.sent=true; setSendStat("ok"); }
    else {
      var a=readOutbox(); a.push(p); writeOutbox(a);
      setSendStat("fail");
    }
  });
}
function retrySend(){
  if(state.sent || state.sending || !lastPayload) return;
  state.sending=true; setSendStat("send");
  var p=lastPayload;
  sendPayload(p, function(ok){
    state.sending=false;
    if(ok){
      state.sent=true;
      // it went through — pull the queued copy so it doesn't double-send later
      var a=readOutbox().filter(function(x){ return x.ts!==p.ts; }); writeOutbox(a);
      setSendStat("ok");
    } else { setSendStat("fail"); }
  });
}

    '<div class="card"><div class="num" style="font-size:22px;color:var(--flare)">'+speedAll.filter(function(r){return r.ok}).length+'/'+speedQs.length+'</div><div style="font-size:11px;color:var(--haze);letter-spacing:.08em">SPEED</div></div>'+
    '<div class="card"><div class="num" style="font-size:22px;color:var(--reef)">'+steadyRecs.filter(function(r){return r.ok}).length+'/'+steadyQs.length+'</div><div style="font-size:11px;color:var(--haze);letter-spacing:.08em">STEADY</div></div>'+
    '<div class="card"><div class="num" style="font-size:22px;color:var(--kelp)">✓</div><div style="font-size:11px;color:var(--haze);letter-spacing:.08em">TEACH-BACK</div></div>'+
  '</div>'+
  '<div id="sendStat" class="sendstat wait">⏳ Uploading to the Vault…</div>'+
  (f.skips.length?'<p class="note" style="margin:0 0 14px">'+f.skips.length+' marked "not covered yet" — that\'s intel, not a miss.</p>':'')+
  flags+
  '<button class="cta display" style="width:100%;background:transparent;color:var(--ink);border:2px solid var(--line);font-size:16px" onclick="emailBackup()">Backup: email it instead →</button>'+
  '<button class="cta display" id="copyBtn" style="width:100%;margin-top:10px;background:transparent;color:var(--ink);border:2px solid var(--line);font-size:16px" onclick="copyResults()">or copy it instead</button>'+
  '<button class="ghost" style="margin:10px auto 0;text-align:center" onclick="showRaw()">neither working? tap here</button>'+
  '<div id="rawBox"></div>'+
  '<p class="note" style="text-align:center;margin-top:10px">Results send themselves now. The buttons above are just backups.</p>';
  if(isBlitz(EVENT)){ setTimeout(function(){ FX.showpiece(fxPalette()); }, 160); } // ×2 reveal — timed to the hero pop-in
  else if(EVENT!=="battleground" && runLocalBadges(f).length){ setTimeout(function(){ FX.showpiece(fxPalette()); }, 200); } // badge unlock on a standard night
  autoSubmit();
}

function showRaw(){
  el("rawBox").innerHTML = '<div class="box" id="rawText">'+esc(summaryText())+'</div>'+
    '<p class="note" style="text-align:center;margin-top:6px">Long-press → Select All → Copy. Or just screenshot it.</p>';
}

var RESULTS_EMAIL = "richdrw@gmail.com";  // Vault destination (backup email path)

function emailBackup(){
  var subject = state.appName + " — " + CONFIG.NAME + " — " + quizLabel();
  var body = summaryText();
  var href = "mailto:" + RESULTS_EMAIL +
             "?subject=" + encodeURIComponent(subject) +
             "&body=" + encodeURIComponent(body);
  try { window.location.href = href; } catch(e){ showRaw(); }
  setTimeout(function(){ if(!el("rawText")) showRawQuiet(); }, 2500);
}

function showRawQuiet(){
  if(el("rawText")) return;
  el("rawBox").innerHTML = '<p class="note" style="text-align:center;margin-top:12px">Mail app didn\'t open? <a href="#" onclick="showRaw();return false;" style="color:var(--reef)">tap here for the text</a></p>';
}

function copyResults(){
  var text=summaryText();
  function done(){ var b=el("copyBtn"); b.textContent="Copied ✓"; b.style.background="var(--kelp)";
    setTimeout(function(){ b.textContent="or copy it instead"; b.style.background="transparent"; },2500); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ legacy(); });
  } else legacy();
  function legacy(){
    var ta=document.createElement("textarea"); ta.value=text;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta); done();
  }
}

boot();
</script>
</body>
</html>
