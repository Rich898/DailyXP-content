name: Friday report

# Friday carries TWO parent texts on different clocks: the on-completion evening
# soundbyte (~8:30pm) and THIS scheduled weekly report. Fires after the soundbyte
# so the day's run is usually already in; if it isn't, the report honestly reads
# four days instead of five.
#
# GitHub's scheduler runs late or skips — always VERIFY the send, and manual
# dispatch is the fallback (the cursor makes re-running safe: one send per kid
# per week, so a re-run after a partial failure is a no-op for whoever got it).

on:
  schedule:
    # Polled, not single-shot — GitHub's cron drops runs. The weekly cursor
    # (one send per kid per week) makes every repeat a no-op.
    - cron: "35 10 * * 5"      # 20:35 AEST Fri  (target)
    - cron: "5 11 * * 5"       # 21:05 AEST Fri  (catch-up)
    - cron: "45 11 * * 5"      # 21:45 AEST Fri  (catch-up)
    - cron: "30 21 * * 5"      # 07:30 AEST Sat  (last resort — better late than never)
  workflow_dispatch:
    inputs:
      student:
        description: "single player (blank = all active)"
        required: false
        default: ""
      dry_run:
        description: "build + render only, no deploy, no SMS"
        type: boolean
        default: false
      no_sms:
        description: "deploy the page but don't text"
        type: boolean
        default: false

concurrency:
  group: friday-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content (public)
        uses: actions/checkout@v4

      # Any repo we PUSH to in CI must use DAILYXP_TOKEN with persist-credentials
      # false — the persisted bot credential 403s on push (first-run gotcha #2).
      - name: Checkout private (ledger, runs, plans, cursors)
        uses: actions/checkout@v4
        with:
          repository: Rich898/DailyXP-private
          token: ${{ secrets.DAILYXP_TOKEN }}
          persist-credentials: false
          path: private

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Integrity + quality on the week's teach-backs BEFORE the report builds:
      # tb_integrity is deterministic (code judges plausibility, never a model);
      # tb_grade is the one language judgement. Both Friday surfaces quote
      # through the same gate (pick_quote), which reads these annotations —
      # without this step the strongest section on either page is empty.
      # Annotated runs.json persists via the commit-private step below.
      - name: Grade teach-backs (integrity + quality)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/grade_teachback.py --private-dir private

      - name: Build + deploy + send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Depth rungs render on the family-facing surfaces (parent report +
          # kid wrap). Rubric calibration — the gate condition in UNDERSTANDING.md
          # §7 — passed 13/13 on 22 Aug, so the depth story is shown, not withheld.
          DAILYXP_DEPTH_REPORTS_LIVE: "1"
          MOBILE_MESSAGE_API_KEY: ${{ secrets.MOBILE_MESSAGE_API_KEY }}
          MOBILE_MESSAGE_API_SECRET: ${{ secrets.MOBILE_MESSAGE_API_SECRET }}
          MOBILE_MESSAGE_SENDER: ${{ secrets.MOBILE_MESSAGE_SENDER }}
          # PARENT seats only — this job texts parents, never the boys.
          # (notify.py resolves "parents:<code>" -> MOBILE_MESSAGE_PARENTS_<CODE>.)
          MOBILE_MESSAGE_PARENTS_Y8: ${{ secrets.MOBILE_MESSAGE_PARENTS_Y8 }}
          MOBILE_MESSAGE_PARENTS_Y9: ${{ secrets.MOBILE_MESSAGE_PARENTS_Y9 }}
          MOBILE_MESSAGE_PARENTS_T1: ${{ secrets.MOBILE_MESSAGE_PARENTS_T1 }}
          MOBILE_MESSAGE_TO_PARENTS: ${{ secrets.MOBILE_MESSAGE_TO_PARENTS }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DAILYXP_REPORTS_BASE: https://xpdaily-reports.netlify.app
        run: |
          ARGS="--private-dir private"
          [ -n "${{ github.event.inputs.student }}" ] && ARGS="$ARGS --student ${{ github.event.inputs.student }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.no_sms }}" = "true" ] && ARGS="$ARGS --no-sms"
          echo "friday_report_run $ARGS"
          python tools/friday_report_run.py $ARGS

      # Dry-run previews (page HTML + SMS body) carry names and per-kid URLs,
      # so they ship as a private artifact for the operator's eyes — NEVER
      # printed into this public repo's logs. This is the pre-send review
      # window for any new/changed report format.
      - name: Upload dry-run previews (operator review)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report-previews
          path: private/work/preview_report_*
          retention-days: 7
          if-no-files-found: warn

      - name: Commit private state (cursor + weekly snapshot + slugs)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: private
        env:
          DAILYXP_TOKEN: ${{ secrets.DAILYXP_TOKEN }}
        run: |
          git config user.name "DailyXP"
          git config user.email "dailyxp@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "friday report: cursor + snapshot ($(date -u +%F))"
            git push "https://x-access-token:${DAILYXP_TOKEN}@github.com/Rich898/DailyXP-private.git" HEAD:main
            echo "private state committed."
          else
            echo "no private changes."
          fi
