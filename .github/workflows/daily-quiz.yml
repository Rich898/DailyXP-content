# DailyXP — daily quiz pipeline
#
# Runs the whole loop for every active roster seat (y8, y9, t1): ingest -> state-writer ->
# seed -> plan -> compose (API) -> review -> publish (with live-URL verify). A FROZEN seat
# gets a placeholder (no API). SMS is decoupled: the kid nudge is the 4pm job
# (kid-nudge.yml), the parent soundbyte the evening one. See scripts/run_daily.py.
#
# TRIGGERS (two schedulers, by design — DAILY-PUBLISHING.md §2):
#   * Supabase pg_cron (PRIMARY) fires workflow_dispatch at 14:00 Sydney, DST-proof,
#     deduped once per local day (supabase/002_scheduler.sql).
#   * The `schedule:` cron below (BACKUP) stays enabled at 04:00 UTC. Backup runs pass
#     --skip-if-published, so when the primary already published today's sets they are a
#     per-student no-op — and when the 2pm run failed or HELD, the backup genuinely retries.
#     (Fix 20 Aug 2026: before this guard the pipeline published twice most weekdays.)
#   * Manual "Run workflow" always publishes (no guard) — use it for supervised runs.
#
# SECRETS required (repo Settings -> Secrets and variables -> Actions):
#   DAILYXP_TOKEN            the fine-grained PAT that can read+write BOTH repos ("DailyXP both")
#   ANTHROPIC_API_KEY        for compose
#   RESULTS_URL              the read-only Apps Script /exec endpoint (Sheet -> runs.json ingestion)
#   RESULTS_KEY              the shared secret matching the script's INGEST_KEY property
#   MOBILE_MESSAGE_*         used by the kid-nudge + evening-soundbyte workflows (not here)

name: daily-quiz

on:
  workflow_dispatch:          # manual button AND the pg_cron primary dispatch
    inputs:
      date:
        description: "Override date (YYYY-MM-DD). Blank = today."
        required: false
        default: ""
      student:
        description: "Which player"
        required: false
        default: "both"
        type: choice
        options: ["both", "y8", "y9", "t1"]
      dry_run:
        description: "Plan+compose only — no publish, no SMS"
        required: false
        default: false
        type: boolean
  schedule:
    # BACKUP trigger only (see header). 04:00 UTC = 14:00 AEST; during Sydney DST
    # (Oct–Apr) this slides to 15:00 local, which is fine for a guarded backup.
    - cron: "0 4 * * 1-5"

concurrency:
  group: daily-quiz            # never let two runs overlap on the same files
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (code + live files)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DAILYXP_TOKEN }}
          persist-credentials: false

      - name: Checkout private repo (ledger/state/targets/history)
        uses: actions/checkout@v4
        with:
          repository: Rich898/DailyXP-private
          token: ${{ secrets.DAILYXP_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the daily pipeline
        env:
          GH_TOKEN: ${{ secrets.DAILYXP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILYXP_DEPTH_LIVE: "1"   # depth writes to the ledger; shown on the Friday surfaces since 27 Aug (DAILYXP_DEPTH_REPORTS_LIVE=1 in friday-report.yml)
          RESULTS_URL: ${{ secrets.RESULTS_URL }}
          RESULTS_KEY: ${{ secrets.RESULTS_KEY }}
          # Supabase settling-week wiring (fix 20 Aug 2026 — DAILY-PUBLISHING.md O2):
          # with both credential pairs present, ingest_results auto-runs BOTH mode —
          # the Sheet stays truth; the run prints the supabase-sink agreement line.
          # The flip to Supabase-only (INGEST_SOURCE=supabase) is a later, deliberate act.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Seat-down ops alert (HARDENING item 4): if a seat compose-fails / holds / fails
          # to publish, text Rich. Shadow by default — flip to "true" to arm the SMS (the
          # warning annotation shows either way). Version-controlled arm switch, no dashboard.
          DAILYXP_SEAT_ALERT_LIVE: "true"
          MOBILE_MESSAGE_API_KEY: ${{ secrets.MOBILE_MESSAGE_API_KEY }}
          MOBILE_MESSAGE_API_SECRET: ${{ secrets.MOBILE_MESSAGE_API_SECRET }}
          MOBILE_MESSAGE_SENDER: ${{ secrets.MOBILE_MESSAGE_SENDER }}
          MOBILE_MESSAGE_TO_T1: ${{ secrets.MOBILE_MESSAGE_TO_T1 }}   # Rich's handset — ops only
        run: |
          ARGS="--private-dir ./private"
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.student }}" != "both" ] && [ -n "${{ github.event.inputs.student }}" ] && ARGS="$ARGS --student ${{ github.event.inputs.student }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          # Backup-trigger guard: only GitHub's own cron passes the skip flag. pg_cron fires
          # via workflow_dispatch, so the primary (and any manual run) always publishes.
          [ "${{ github.event_name }}" = "schedule" ] && ARGS="$ARGS --skip-if-published"
          echo "run_daily $ARGS"
          python scripts/run_daily.py $ARGS

      - name: Commit private state back (history archive + any state writes)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: private
        env:
          DAILYXP_TOKEN: ${{ secrets.DAILYXP_TOKEN }}
        run: |
          git config user.name "DailyXP"
          git config user.email "dailyxp@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "state: archive + ledger updates ($(date -u +%F))"
            git push "https://x-access-token:${DAILYXP_TOKEN}@github.com/Rich898/DailyXP-private.git" HEAD:main
            echo "private state committed."
          else
            echo "no private changes to commit."
          fi
