# sweep-shadow.yml — SHADOW-ONLY automated Canvas sweep (trust-ladder stage).
#
# What this is: a raw pull of each seat's Canvas via that student's own API
# token, written to the PRIVATE repo under shadow/sweeps/<sydney-date>/. That
# path is physically outside targets/, which the live pipeline auto-picks —
# so nothing this workflow does can reach a real quiz.
# Triggers: a Monday-morning timer (21:07 UTC Sunday = 07:07 Sydney, 08:07
# during AEDT) plus the on-demand button. The timer only ever feeds shadow/;
# promotion is a separate, later change: after the shadow sweep matches or
# beats the manual sweep, the output destination moves to targets/ behind the
# validator gate. Until then this stays observation-only.
#
# Secrets required (repo → Settings → Secrets and variables → Actions):
#   CANVAS_BASE_URL   the school Canvas address, e.g. https://xxx.instructure.com
#   CANVAS_TOKEN_Y8   student token for seat y8 (minted by the student,
#   CANVAS_TOKEN_Y9    Settings → Approved Integrations → New Access Token)
#   DAILYXP_TOKEN     existing fine-grained PAT, both repos
name: sweep-shadow

on:
  schedule:
    - cron: "7 21 * * 0"   # Sun 21:07 UTC = Mon 07:07 Sydney (AEST)
  workflow_dispatch:
    inputs:
      seat:
        description: "Seat code to sweep (blank or 'all' = every eligible seat)"
        required: false
        default: "all"
      mode:
        description: "full = fetch+summarise | fetch = raw pull only | summarise = reuse today's dump"
        required: false
        default: "full"

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repo (code + roster)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DAILYXP_TOKEN }}

      - name: Checkout private repo (shadow destination)
        uses: actions/checkout@v4
        with:
          repository: Rich898/DailyXP-private
          token: ${{ secrets.DAILYXP_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Compute stamp, seat filter, base and manual targets
        run: |
          echo "STAMP=$(TZ=Australia/Sydney date +%F)" >> "$GITHUB_ENV"
          SEAT_ARG=""
          if [ -n "${{ github.event.inputs.seat }}" ] && [ "${{ github.event.inputs.seat }}" != "all" ]; then
            SEAT_ARG="--seat ${{ github.event.inputs.seat }}"
          fi
          echo "SEAT_ARG=${SEAT_ARG}" >> "$GITHUB_ENV"
          MANUAL=$(ls private/targets/*.json | sort | tail -1)
          WEEK_MON=$(TZ=Australia/Sydney date -d "-$(( $(TZ=Australia/Sydney date +%u) - 1 )) days" +%F)
          MANUAL_DATE=$(basename "$MANUAL" .json)
          if [ "$MANUAL_DATE" \< "$WEEK_MON" ]; then
            # this week's manual isn't in yet — the sweep UPDATES last week's file
            BASE="$MANUAL"
          else
            # this week's manual exists — replay mode: build on the week before, compare to it
            BASE=$(ls private/targets/*.json | sort | tail -2 | head -1)
            if [ "$BASE" = "$MANUAL" ]; then BASE=""; fi
          fi
          echo "MANUAL=${MANUAL}" >> "$GITHUB_ENV"
          echo "BASE=${BASE}" >> "$GITHUB_ENV"
          echo "carry-forward base: ${BASE:-none (first sweep)} | diff target: ${MANUAL}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run shadow fetch
        if: ${{ github.event.inputs.mode != 'summarise' }}
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN_Y8: ${{ secrets.CANVAS_TOKEN_Y8 }}
          CANVAS_TOKEN_Y9: ${{ secrets.CANVAS_TOKEN_Y9 }}
        run: |
          set -o pipefail
          python3 tools/sweep_fetch.py --out "private/shadow/sweeps/${STAMP}" ${SEAT_ARG} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarise into targets format (LLM language layer)
        if: ${{ github.event.inputs.mode != 'fetch' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/sweep_summarise.py \
            --dump "private/shadow/sweeps/${STAMP}" \
            --out  "private/shadow/sweeps/${STAMP}/targets-shadow.json" \
            --manual-dir private/targets ${BASE:+--base "$BASE"} ${SEAT_ARG} 2>&1 \
            | tee "private/shadow/sweeps/${STAMP}/summarise.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate (deterministic gate)
        if: ${{ github.event.inputs.mode != 'fetch' }}
        run: |
          set -o pipefail
          python3 tools/sweep_validate.py \
            --targets "private/shadow/sweeps/${STAMP}/targets-shadow.json" \
            --dump "private/shadow/sweeps/${STAMP}" \
            --manual-dir private/targets ${BASE:+--base "$BASE"} 2>&1 \
            | tee "private/shadow/sweeps/${STAMP}/validate.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diff against newest manual sweep
        if: ${{ !cancelled() && github.event.inputs.mode != 'fetch' }}
        run: |
          echo "diffing against ${MANUAL}" | tee -a "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          python3 tools/sweep_diff.py \
            --machine "private/shadow/sweeps/${STAMP}/targets-shadow.json" \
            --manual "${MANUAL}" \
            --out "private/shadow/sweeps/${STAMP}/DIFF.md" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit shadow dump to private repo
        if: always()
        working-directory: private
        run: |
          git config user.name "DailyXP"
          git config user.email "richdrw@gmail.com"
          git add shadow/sweeps
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "shadow sweep ${STAMP} (raw pull)"
            git pull --rebase origin main
            git push origin main
          fi
