# DailyXP — the 4pm kid nudge ("XP Daily is up")
#
# Decoupled from the 2pm publish on purpose: this job VERIFIES the live set is
# today's (same raw URL the shell fetches) before texting, so a review HOLD or
# frozen day never texts a promise not kept. Stateless — reads the live URL,
# sends, writes nothing. Flavoured by the weekly skeleton (Wed blitz, Fri boss).
# See tools/kid_nudge.py.
#
# SECRETS used: MOBILE_MESSAGE_API_KEY / _API_SECRET / _SENDER / _TO_Y8 / _TO_Y9

name: kid-nudge

on:
  workflow_dispatch:
    inputs:
      student:
        description: "Which player (roster code, or all)"
        required: false
        default: "all"
      force:
        description: "ignore the once-a-day cursor and re-send"
        type: boolean
        default: false
      dry_run:
        description: "Verify + decide only — no send"
        required: false
        default: false
        type: boolean
  # Cron ENABLED at go-live (Sun 9 Aug 2026).
  # 4:00pm Sydney, Mon–Fri (school's out ~3:10; phones back in hands).
  schedule:
  #   # AEST = UTC+10. (Sydney DST Oct–Apr: subtract 1 from the UTC hour to
  #   # pin 4pm local.)
    # GitHub's scheduler is BEST-EFFORT: it queues under load and silently drops
    # runs. Proven twice (10 + 11 Aug) that a single cron misses. So we poll like
    # evening-soundbyte does — the nudge cursor makes every repeat a no-op, so
    # the only cost of a redundant fire is a few free Actions seconds.
    - cron: "0 6 * * 1-5"     # 16:00 AEST  (target)
    - cron: "20 6 * * 1-5"    # 16:20 AEST  (catch-up)
    - cron: "45 6 * * 1-5"    # 16:45 AEST  (catch-up)
    - cron: "15 7 * * 1-5"    # 17:15 AEST  (last chance before dinner)

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (code)
        uses: actions/checkout@v4

      # Needed for the once-a-day cursor that makes the retry ladder safe.
      # Pushed to in CI -> DAILYXP_TOKEN + persist-credentials false (gotcha #2).
      - name: Checkout private (nudge cursor)
        uses: actions/checkout@v4
        with:
          repository: Rich898/DailyXP-private
          token: ${{ secrets.DAILYXP_TOKEN }}
          persist-credentials: false
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify live set, then nudge
        env:
          MOBILE_MESSAGE_API_KEY: ${{ secrets.MOBILE_MESSAGE_API_KEY }}
          MOBILE_MESSAGE_API_SECRET: ${{ secrets.MOBILE_MESSAGE_API_SECRET }}
          MOBILE_MESSAGE_SENDER: ${{ secrets.MOBILE_MESSAGE_SENDER }}
          MOBILE_MESSAGE_TO_Y8: ${{ secrets.MOBILE_MESSAGE_TO_Y8 }}
          MOBILE_MESSAGE_TO_Y9: ${{ secrets.MOBILE_MESSAGE_TO_Y9 }}
          MOBILE_MESSAGE_TO_T1: ${{ secrets.MOBILE_MESSAGE_TO_T1 }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.student }}" != "all" ] && [ -n "${{ github.event.inputs.student }}" ] && ARGS="$ARGS --student ${{ github.event.inputs.student }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          ARGS="$ARGS --private-dir private"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python tools/kid_nudge.py $ARGS

      - name: Commit nudge cursor
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: private
        env:
          DAILYXP_TOKEN: ${{ secrets.DAILYXP_TOKEN }}
        run: |
          git config user.name "DailyXP"
          git config user.email "dailyxp@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "nudge: cursor advance ($(date -u +%F))"
            git pull --rebase --autostash \
              "https://x-access-token:${DAILYXP_TOKEN}@github.com/Rich898/DailyXP-private.git" main || true
            git push "https://x-access-token:${DAILYXP_TOKEN}@github.com/Rich898/DailyXP-private.git" HEAD:main
            echo "cursor committed."
          else
            echo "no cursor change."
          fi
