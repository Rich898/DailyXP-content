# DailyXP — evening parent soundbyte (REPORTING.md touchpoint 1: REASSURE)
#
# Separate from the 2pm pipeline on purpose: this job POLLS in the evening for
# "did today's run land?" and, the first time it has, texts the parents one
# deterministic THREE-BEAT line: did it + tonight's XP + a verdict closer
# (the verdict ladder — effort/energy words picked by code from score/max;
# no percentages, no ratios, no running totals, per the no-ammunition law
# final form, REPORTING.md). Idempotent via a cursor in the private repo;
# polls that find nothing are silent no-ops. No AI, no ledger writes — reads
# runs.json, writes only its own cursor. See tools/soundbyte.py for the laws.
#
# WEDNESDAYS: the wed-checkin job polls five minutes ahead (6:25/8:25pm) and
# usually sends the MERGED message (three beats + midweek body), advancing
# this job's cursor too — so this job no-ops. The 9:30pm poll here stays the
# late-run safety net (a run landing after the 8:25 cutoff still gets its
# soundbyte, keeping the check-in's "the usual text will follow" promise).
#
# SECRETS used (already defined for daily-quiz — nothing new):
#   DAILYXP_TOKEN, RESULTS_URL, RESULTS_KEY, MOBILE_MESSAGE_*
# (No ANTHROPIC_API_KEY — the evening path is deliberately AI-free.)
#
# Until the Mobile Message secrets exist, a queued soundbyte will report
# "send FAILED — cursor NOT advanced" each poll: harmless, and it starts
# working the moment the secrets are added.

name: evening-soundbyte

on:
  workflow_dispatch:            # manual button for supervised runs / testing
    inputs:
      date:
        description: "Override Sydney date (YYYY-MM-DD). Blank = today."
        required: false
        default: ""
      dry_run:
        description: "Plan only — no send, no cursor write"
        required: false
        default: false
        type: boolean
  # Cron ENABLED at go-live (Sun 9 Aug 2026).
  # Three evening polls, Sydney time: 6:30pm, 8:00pm, 9:30pm (Mon–Fri).
  schedule:
  #   # AEST = UTC+10. (Sydney DST Oct–Apr shifts these an hour later locally —
  #   # subtract 1 from the UTC hours during DST to pin the local times.)
    - cron: "30 8 * * 1-5"    # 18:30 AEST
    - cron: "0 10 * * 1-5"    # 20:00 AEST
    - cron: "30 11 * * 1-5"   # 21:30 AEST

concurrency:
  group: daily-quiz             # serialize with the 2pm pipeline — never
  cancel-in-progress: false     # two jobs on the same private files

jobs:
  soundbyte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (code)
        uses: actions/checkout@v4

      - name: Checkout private repo (runs + cursor)
        uses: actions/checkout@v4
        with:
          repository: Rich898/DailyXP-private
          token: ${{ secrets.DAILYXP_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll + send (log is public — script prints no names/scores/text)
        env:
          MOBILE_MESSAGE_API_KEY: ${{ secrets.MOBILE_MESSAGE_API_KEY }}
          MOBILE_MESSAGE_API_SECRET: ${{ secrets.MOBILE_MESSAGE_API_SECRET }}
          MOBILE_MESSAGE_SENDER: ${{ secrets.MOBILE_MESSAGE_SENDER }}
          MOBILE_MESSAGE_PARENTS_Y8: ${{ secrets.MOBILE_MESSAGE_PARENTS_Y8 }}
          MOBILE_MESSAGE_PARENTS_Y9: ${{ secrets.MOBILE_MESSAGE_PARENTS_Y9 }}
          MOBILE_MESSAGE_PARENTS_T1: ${{ secrets.MOBILE_MESSAGE_PARENTS_T1 }}
          MOBILE_MESSAGE_TO_PARENTS: ${{ secrets.MOBILE_MESSAGE_TO_PARENTS }}
          RESULTS_URL: ${{ secrets.RESULTS_URL }}
          RESULTS_KEY: ${{ secrets.RESULTS_KEY }}
          # Supabase settling-week wiring (fix 20 Aug 2026 — DAILY-PUBLISHING.md O2):
          # with both credential pairs present, ingest_results auto-runs BOTH mode —
          # the Sheet stays truth; the run prints the supabase-sink agreement line.
          # The flip to Supabase-only (INGEST_SOURCE=supabase) is a later, deliberate act.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--private-dir ./private"
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python tools/soundbyte.py $ARGS

      - name: Commit cursor back (private repo)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: private
        env:
          DAILYXP_TOKEN: ${{ secrets.DAILYXP_TOKEN }}
        run: |
          git config user.name "DailyXP"
          git config user.email "dailyxp@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "soundbyte: cursor advance ($(date -u +%F))"
            git push "https://x-access-token:${DAILYXP_TOKEN}@github.com/Rich898/DailyXP-private.git" HEAD:main
            echo "cursor committed."
          else
            echo "no cursor change."
          fi
