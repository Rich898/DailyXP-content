<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Swipe widget — integration harness</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* harness-only chrome (NOT part of the widget) */
:root{--field:#0B1220;--ink:#0C1521;--haze:#8A97AD}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070c15;font-family:'Space Grotesk',system-ui,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px}
.frame{width:100%;max-width:420px;background:radial-gradient(120% 90% at 50% 6%,#16273f,#0B1220 55%,#070c15);border:1px solid rgba(255,255,255,.12);border-radius:22px;overflow:hidden;position:relative}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;color:var(--haze)}
.hud b{font-family:'Archivo Black',sans-serif;color:#FFD34D;font-size:18px}
#mount{position:relative;height:520px}
.log{width:100%;max-width:420px;font-family:'Space Mono',monospace;font-size:12px;color:var(--haze);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;min-height:44px}
.log b{color:#8CF0C0}
.note{max-width:420px;font-size:11px;color:var(--haze);text-align:center}
</style>
</head>
<body>
<div class="note">INTEGRATION HARNESS — proving the swipe widget mounts, plays, and reports a result. This is the piece the shell will embed.</div>
<div class="frame">
  <div class="hud"><span>SWIPE BLOCK · <span id="qn">1</span>/3</span><span>SCORE <b id="score">0</b></span></div>
  <div id="mount"></div>
</div>
<div class="log" id="log">Mounted. Swipe or tap a bucket…</div>

<script>
'use strict';
/* =========================================================================
   mountSwipe(container, q, onDone)  — the embeddable widget
   q schema:  { type:'swipe', prompt, left, right, answer:<left|right label>, why }
   onDone:    called once with { ok, sideLabel } after the card lands.
   Self-contained: injects its CSS once, owns its DOM inside `container`.
   ========================================================================= */
function mountSwipe(container, q, onDone){
  injectCSS();
  container.innerHTML =
    '<div class="sw-pills">'+
      '<button class="sw-pill sw-L" type="button">'+esc(q.left)+'</button>'+
      '<button class="sw-pill sw-R" type="button">'+esc(q.right)+'</button>'+
    '</div>'+
    '<div class="sw-stage">'+
      '<div class="sw-card">'+
        '<div class="sw-face">'+
          (q.eyebrow||q.subject ? '<span class="sw-eyebrow" style="color:'+(q.eyebrowColor||'#8A97AD')+'">'+esc(q.eyebrow||q.subject)+'</span>' : '')+
          '<h2>'+esc(q.prompt)+'</h2>'+
          (q.idx ? '<span class="sw-idx">'+esc(q.idx)+'</span>' : '')+
        '</div>'+
        '<span class="sw-stamp SL">'+esc(q.left)+'</span>'+
        '<span class="sw-stamp SR">'+esc(q.right)+'</span>'+
      '</div>'+
      '<div class="sw-strip"></div>'+
    '</div>'+
    '<div class="sw-fx"></div>';

  var pillL=container.querySelector('.sw-L'), pillR=container.querySelector('.sw-R');
  var card=container.querySelector('.sw-card'), stage=container.querySelector('.sw-stage');
  var strip=container.querySelector('.sw-strip'), fx=container.querySelector('.sw-fx');
  var phase='live', drag=null, done=false;

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

  function paint(dx,dy){
    var s=clamp(1.02-Math.abs(dx)/220,0.55,1.02);
    card.style.transform='translate3d('+dx+'px,'+dy+'px,0) rotate('+clamp(dx/20,-12,12)+'deg) scale('+s.toFixed(3)+')';
    var o=Math.min(1,Math.abs(dx)/90);
    card.querySelector('.SL').style.opacity=dx<0?o:0;
    card.querySelector('.SR').style.opacity=dx>0?o:0;
    pillL.classList.toggle('hot',dx<-30); pillR.classList.toggle('hot',dx>30);
  }
  function flyToPill(side){
    var pill=side==='L'?pillL:pillR, pr=pill.getBoundingClientRect();
    var px=pr.left+pr.width/2, py=pr.top+pr.height/2, prev=card.style.transform;
    card.style.transition='none'; card.style.transform='none';
    var br=card.getBoundingClientRect(), bx=br.left+br.width/2, by=br.top+br.height/2;
    var dx=px-bx, dy=py-by;
    card.style.transform=prev||'none'; void card.offsetWidth;
    card.style.transition='transform .3s cubic-bezier(.4,.55,.35,1)';
    card.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale(.26) rotate(0deg)';
    pillL.classList.remove('hot'); pillR.classList.remove('hot');
    return {x:px,y:py,dx:dx,dy:dy,pill:pill};
  }
  function burst(x,y){
    var C=['#FFD34D','#FFB800','#39A7DE','#16E08C','#fff'];
    for(var i=0;i<20;i++){(function(){
      var s=document.createElement('i'); s.className='sw-spark';
      var a=Math.random()*Math.PI*2,d=42+Math.random()*72,z=7+Math.random()*7;
      s.style.left=x+'px'; s.style.top=y+'px'; s.style.width=z+'px'; s.style.height=z+'px';
      s.style.background=C[i%C.length];
      s.style.setProperty('--tx',(Math.cos(a)*d).toFixed(1)+'px');
      s.style.setProperty('--ty',(Math.sin(a)*d+30).toFixed(1)+'px');
      s.style.setProperty('--r',(Math.random()*540-270)+'deg');
      if(Math.random()<.4) s.style.borderRadius='50%';
      fx.appendChild(s); setTimeout(function(){s.remove();},760);
    })();}
  }
  function shake(){ stage.classList.remove('shk'); void stage.offsetWidth; stage.classList.add('shk'); setTimeout(function(){stage.classList.remove('shk');},440); }

  function commit(side){
    if(phase!=='live') return; phase='resolving';
    var label = side==='L' ? q.left : q.right;
    var ok = label === q.answer;
    var at = flyToPill(side);
    var pill = at.pill;
    setTimeout(function(){
      pill.style.position='relative'; pill.style.zIndex='20'; pill.classList.add('catch',ok?'ok':'bad');
      card.style.transition='transform .17s cubic-bezier(.5,.15,.7,1),opacity .17s ease';
      card.style.transform='translate3d('+at.dx+'px,'+(at.dy+6)+'px,0) scale(0)'; card.style.opacity='0';
      if(ok){ buzz(18); burst(at.x,at.y); }
      else { buzz([30,50,30]); shake();
        strip.innerHTML='\u2715 <b>'+esc(q.answer)+'</b> \u2014 '+esc(q.why); strip.classList.add('on'); }
    }, 300);
    setTimeout(function(){
      pill.classList.remove('catch','ok','bad'); pill.style.zIndex=''; pill.style.position='';
      if(done) return; done=true;
      if(ok){ finishOut(ok,label); }
      else { setTimeout(function(){ strip.classList.remove('on'); finishOut(ok,label); }, 1200); }
    }, 300+180);
  }
  function finishOut(ok,label){ try{ onDone && onDone({ok:ok,sideLabel:label}); }catch(e){} }

  /* drag */
  card.addEventListener('pointerdown',function(e){
    if(phase!=='live') return; card.setPointerCapture(e.pointerId); card.style.transition='none';
    card.classList.add('grab'); drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,dx:0,dy:0,hist:[[performance.now(),e.clientX]]}; paint(0,0);
  });
  card.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id||phase!=='live') return;
    drag.dx=e.clientX-drag.x0; drag.dy=e.clientY-drag.y0; paint(drag.dx,drag.dy);
    var n=performance.now(); (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(function(ev){drag.hist.push([n,ev.clientX]);});
    if(drag.hist.length>10) drag.hist.splice(0,drag.hist.length-10);
  });
  function release(e){
    if(!drag||e.pointerId!==drag.id) return;
    if(phase!=='live'){ drag=null; return; }
    var dx=drag.dx, v=vel(drag.hist); drag=null; card.classList.remove('grab');
    var w=card.getBoundingClientRect().width||300, thr=Math.min(88,w*.26);
    var flick=Math.abs(v)>.4&&Math.abs(dx)>22&&Math.sign(v)===Math.sign(dx);
    if(Math.abs(dx)>thr||flick) commit(dx<0?'L':'R');
    else { card.style.transition='transform .3s cubic-bezier(.2,1.5,.4,1)'; card.style.transform=''; card.querySelector('.SL').style.opacity=0; card.querySelector('.SR').style.opacity=0; pillL.classList.remove('hot'); pillR.classList.remove('hot'); }
  }
  function vel(h){ if(h.length<2)return 0; var t=h[h.length-1][0],i=h.length-2; while(i>0&&t-h[i][0]<90)i--; var dt=t-h[i][0]; return dt>0?(h[h.length-1][1]-h[i][1])/dt:0; }
  card.addEventListener('pointerup',release); card.addEventListener('pointercancel',release);
  pillL.addEventListener('click',function(){ if(phase==='live'){ card.style.transition='none'; commit('L'); } });
  pillR.addEventListener('click',function(){ if(phase==='live'){ card.style.transition='none'; commit('R'); } });

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

function injectCSS(){
  if(document.getElementById('sw-widget-css')) return;
  var css=document.createElement('style'); css.id='sw-widget-css';
  css.textContent=
  ".sw-pills{display:flex;gap:12px;padding:12px 14px 0}"+
  ".sw-pill{flex:1;font-family:'Archivo Black',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:21px 10px;border-radius:16px;border:2.5px solid;background:rgba(255,255,255,.04);color:#fff;transition:transform .15s,background .15s,box-shadow .15s,color .15s;cursor:pointer;touch-action:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}"+
  ".sw-L{border-color:#39A7DE;color:#9AD3F2;box-shadow:inset 0 0 22px rgba(46,155,214,.1)}"+
  ".sw-R{border-color:#FFB800;color:#FFD34D;box-shadow:inset 0 0 22px rgba(255,184,0,.1)}"+
  ".sw-L.hot{background:#0E6BA8;color:#fff;transform:scale(1.06);box-shadow:0 0 28px rgba(46,155,214,.65),inset 0 0 26px rgba(255,255,255,.12)}"+
  ".sw-R.hot{background:#FFB800;color:#3a2600;transform:scale(1.06);box-shadow:0 0 28px rgba(255,184,0,.65)}"+
  ".sw-pill.catch{animation:sw-catch .34s cubic-bezier(.3,1.4,.5,1)}"+
  ".sw-pill.ok{background:#16A46E!important;border-color:#16A46E!important;color:#fff!important;box-shadow:0 0 36px rgba(22,164,110,.85)!important}"+
  ".sw-pill.bad{background:#FF4D29!important;border-color:#FF4D29!important;color:#fff!important;box-shadow:0 0 36px rgba(255,77,41,.85)!important}"+
  "@keyframes sw-catch{0%{transform:scale(1.12)}30%{transform:scale(.9,1.09)}62%{transform:scale(1.06,.96)}100%{transform:scale(1)}}"+
  ".sw-stage{position:relative;height:calc(100% - 92px);min-height:340px;touch-action:none}"+
  ".sw-stage.shk{animation:sw-shk .42s ease}"+
  "@keyframes sw-shk{0%,100%{transform:translateX(0)}12%{transform:translateX(-8px)}24%{transform:translateX(7px)}36%{transform:translateX(-6px)}48%{transform:translateX(5px)}60%{transform:translateX(-3px)}72%{transform:translateX(2px)}}"+
  ".sw-card{position:absolute;inset:0;margin:auto;max-width:270px;max-height:196px;background:radial-gradient(125% 85% at 50% -5%,#FFFFFF 0%,#F6F7F1 58%,#E9EBE3 100%);color:#0C1521;border:none;border-radius:20px;box-shadow:0 8px 0 rgba(0,0,0,.38),0 16px 30px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -4px 8px rgba(16,27,45,.07);text-align:center;touch-action:none;will-change:transform;overflow:hidden}"+
  ".sw-card.grab{box-shadow:0 11px 0 rgba(0,0,0,.42),0 22px 36px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -4px 8px rgba(16,27,45,.07)}"+
  ".sw-card::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:1;background:repeating-linear-gradient(0deg,rgba(16,27,45,.02) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(16,27,45,.02) 0 1px,transparent 1px 4px)}"+
  ".sw-card::after{content:'';position:absolute;inset:9px;border-radius:13px;pointer-events:none;z-index:1;border:1.5px solid rgba(16,27,45,.15);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}"+
  ".sw-face{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px}"+
  ".sw-face .sw-eyebrow{position:absolute;top:15px;left:0;right:0;font-family:'Space Mono',monospace;font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase}"+
  ".sw-face .sw-eyebrow::after{content:'';display:block;width:22px;height:2px;margin:5px auto 0;background:currentColor;opacity:.5;border-radius:2px}"+
  ".sw-card h2{font-family:'Archivo Black',sans-serif;font-size:clamp(20px,6vw,29px);line-height:1.1;letter-spacing:-.01em;color:#0C1521}"+
  ".sw-face .sw-idx{position:absolute;bottom:13px;right:16px;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;color:rgba(16,27,45,.38);letter-spacing:.05em}"+
  ".sw-stamp{position:absolute;z-index:3;top:11px;font-family:'Archivo Black',sans-serif;font-size:14px;text-transform:uppercase;padding:3px 9px;border:3px solid;border-radius:9px;opacity:0;pointer-events:none;max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}"+
  ".sw-stamp.SL{left:10px;color:#0E6BA8;border-color:#0E6BA8;transform:rotate(-12deg)}"+
  ".sw-stamp.SR{right:10px;color:#8A5A00;border-color:#FFB800;transform:rotate(12deg)}"+
  ".sw-strip{position:absolute;left:4px;right:4px;bottom:4px;z-index:6;background:#12233d;border:2px solid rgba(255,255,255,.14);color:#F7F8F4;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600;line-height:1.3;opacity:0;transform:translateY(12px);transition:opacity .18s,transform .18s;pointer-events:none}"+
  ".sw-strip.on{opacity:1;transform:translateY(0)}"+
  ".sw-strip b{color:#FFD34D}"+
  ".sw-fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:visible}"+
  ".sw-spark{position:absolute;z-index:9;pointer-events:none;border-radius:3px;transform:translate(-50%,-50%);animation:sw-burst .74s cubic-bezier(.15,.6,.4,1) forwards}"+
  "@keyframes sw-burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1) rotate(var(--r));opacity:0}}";
  document.head.appendChild(css);
}

/* ===== harness: mount a block of 3 swipe questions, one at a time ===== */
var ACC={Maths:'#B57A00', Science:'#0E8A5F', English:'#7A4F9E', History:'#0E6BA8'};
var BLOCK=[
  {type:'swipe', subject:'Maths',   prompt:'7 \u00d7 8 = 56', left:'True', right:'False', answer:'True',  why:'7 \u00d7 8 = 56.'},
  {type:'swipe', subject:'Science', prompt:'Copper',        left:'Metal',right:'Non-metal',answer:'Metal', why:'copper conducts \u2014 metal.'},
  {type:'swipe', subject:'Maths',   prompt:'11 is even',    left:'True', right:'False', answer:'False', why:'11 is odd.'}
];
var i=0, score=0;
function next(){
  if(i>=BLOCK.length){ document.getElementById('log').innerHTML='<b>Block complete</b> \u2014 score '+score+'/'+BLOCK.length+'. (This is the result the shell receives per question.)'; document.getElementById('mount').innerHTML=''; return; }
  document.getElementById('qn').textContent=i+1;
  var q=BLOCK[i]; q.eyebrow=q.subject; q.eyebrowColor=ACC[q.subject]||'#8A97AD'; q.idx=('0'+(i+1)).slice(-2);
  mountSwipe(document.getElementById('mount'), q, function(res){
    if(res.ok){ score++; document.getElementById('score').textContent=score; }
    document.getElementById('log').innerHTML='Q'+(i+1)+': you chose <b>'+res.sideLabel+'</b> \u2192 '+(res.ok?'<b>correct</b>':'wrong')+'  ·  onDone({ok:'+res.ok+'}) fired';
    i++; setTimeout(next, 500);
  });
}
next();
</script>
</body>
</html>
