<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Numeric widget — integration harness</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--field:#0B1220}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070c15;background-image:radial-gradient(120% 90% at 50% 4%,#16273f,#0B1220 55%,#070c15 100%);background-attachment:fixed;font-family:'Space Grotesk',system-ui,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px}
.note{max-width:420px;font-size:11px;color:#8A97AD;text-align:center}
.frame{width:100%;max-width:420px;border:1px solid rgba(255,255,255,.12);border-radius:22px;overflow:hidden;position:relative;padding:14px}
.hud{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;color:#8A97AD}
.hud b{font-family:'Archivo Black',sans-serif;color:#FFD34D;font-size:18px}
.qh{font-family:'Archivo Black',sans-serif;font-size:clamp(17px,4.8vw,21px);line-height:1.2;text-align:center;margin:0 4px 14px}
#mount{position:relative}
.log{width:100%;max-width:420px;font-family:'Space Mono',monospace;font-size:12px;color:#8A97AD;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;min-height:44px}
.log b{color:#8CF0C0}
</style></head>
<body>
<div class="note">INTEGRATION HARNESS — proving the numeric widget: scoped calculator (method) vs plain pad (mental), safe evaluator, calc-use logged.</div>
<div class="frame">
  <div class="hud"><span>NUMERIC BLOCK · <span id="qn">1</span>/4</span><span>SCORE <b id="score">0</b></span></div>
  <div class="qh" id="qh"></div>
  <div id="mount"></div>
</div>
<div class="log" id="log">Mounted. Type an answer…</div>

<script>
'use strict';
/* =======================================================================
   mountNumeric(container, q, cb)  — embeddable numeric widget
   q: { type:'numeric', subject, prompt, answer:<number>, calc:<bool>, pre, post, why }
   cb: { onCommit, onDone }   onDone -> { ok, value, usedCalc }
   ======================================================================= */
function mountNumeric(container, q, cb){
  nmInjectCSS();
  var _onCommit=(cb&&typeof cb==='object')?cb.onCommit:null;
  var _onDone=(typeof cb==='function')?cb:((cb&&cb.onDone)||null);
  var CALC_KEYS=[['C','(',')','\u232b'],['7','8','9','\u00f7'],['4','5','6','\u00d7'],['1','2','3','\u2212'],['0','.','=','+']];
  var NUM_KEYS =[['7','8','9'],['4','5','6'],['1','2','3'],['\u00b1','0','\u232b']];
  var entry='', usedOp=false, phase='answering', done=false;

  container.innerHTML =
    '<div class="nm-mode '+(q.calc?'calc':'mental')+'">'+(q.calc?'\uD83D\uDDA9 Calculator \u2014 method':'\uD83E\uDDE0 Mental \u2014 no calculator')+'</div>'+
    '<div class="nm-display" id="nmDisp"></div>'+
    '<div class="nm-keys"></div>'+
    '<button class="nm-submit" id="nmSubmit">Submit \u2192</button>'+
    '<div class="nm-result" id="nmResult"></div>';
  var disp=container.querySelector('#nmDisp'), keysWrap=container.querySelector('.nm-keys'),
      submitBtn=container.querySelector('#nmSubmit'), result=container.querySelector('#nmResult');

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function trim(n){ return (Math.round(n*1e6)/1e6).toString(); }
  function isOp(k){ return '+\u2212\u00d7\u00f7()'.indexOf(k)>=0 && k.length===1; }
  function trailingSeg(s){ return s.replace(/.*[+\u2212\u00d7\u00f7()]/,''); }

  /* safe shunting-yard evaluator (no eval) — verbatim from the approved prototype */
  function evalExpr(raw){
    var s=String(raw).replace(/\u00d7/g,'*').replace(/\u00f7/g,'/').replace(/\u2212/g,'-').trim();
    if(s==='') return NaN;
    if(s.charAt(0)==='-') s='0'+s;
    var toks=s.match(/(\d+\.?\d*|\.\d+|[+\-*/()])/g); if(!toks) return NaN;
    var out=[], ops=[], prec={'+':1,'-':1,'*':2,'/':2};
    for(var i=0;i<toks.length;i++){ var t=toks[i];
      if(/^[\d.]/.test(t)){ var n=parseFloat(t); if(!isFinite(n)) return NaN; out.push(n); }
      else if(t==='('){ ops.push(t); }
      else if(t===')'){ while(ops.length && ops[ops.length-1]!=='(') out.push(ops.pop()); if(!ops.length) return NaN; ops.pop(); }
      else { while(ops.length && ops[ops.length-1]!=='(' && prec[ops[ops.length-1]]>=prec[t]) out.push(ops.pop()); ops.push(t); }
    }
    while(ops.length){ var o=ops.pop(); if(o==='(') return NaN; out.push(o); }
    var st=[];
    for(var j=0;j<out.length;j++){ var x=out[j];
      if(typeof x==='number'){ st.push(x); }
      else { var b=st.pop(), a=st.pop(); if(a===undefined||b===undefined) return NaN;
        st.push(x==='+'?a+b:x==='-'?a-b:x==='*'?a*b:a/b); } }
    return st.length===1 ? st[0] : NaN;
  }
  function judge(val){ return isFinite(val) && Math.abs(val - q.answer) <= 0.01; }

  function paint(){
    var shown = entry===''?'<span class="nm-ph">0</span>':esc(entry);
    var pre = q.pre?'<span class="nm-pre">'+esc(q.pre)+'</span>':'';
    var post = q.post?'<span class="nm-unit">'+esc(q.post)+'</span>':'';
    disp.innerHTML = pre+shown+post;
  }
  function nudge(){ disp.classList.remove('nudge'); void disp.offsetWidth; disp.classList.add('nudge'); buzz(30); }
  function renderKeys(){
    var rows=q.calc?CALC_KEYS:NUM_KEYS, cls=q.calc?'nm-pad calc':'nm-pad num', html='<div class="'+cls+'">';
    rows.forEach(function(row){ row.forEach(function(k){
      var c='nm-key'; if(isOp(k)) c+=' op'; else if(k==='=') c+=' eq'; else if(k==='C'||k==='\u232b'||k==='\u00b1') c+=' fn';
      html+='<button class="'+c+'" data-k="'+k+'">'+k+'</button>';
    }); });
    html+='</div>'; keysWrap.innerHTML=html;
    var b=keysWrap.querySelectorAll('.nm-key'); for(var i=0;i<b.length;i++){ (function(btn){ btn.addEventListener('click',function(){ onKey(btn.getAttribute('data-k')); }); })(b[i]); }
  }
  function onKey(k){
    if(phase!=='answering') return; buzz(6);
    if(k==='C'){ entry=''; usedOp=false; }
    else if(k==='\u232b'){ entry=entry.slice(0,-1); }
    else if(k==='\u00b1'){ entry = entry.charAt(0)==='-'?entry.slice(1):'-'+entry; }
    else if(k==='='){ var v=evalExpr(entry); if(isFinite(v)){ entry=trim(v); usedOp=true; } else nudge(); }
    else if(k==='.'){ var seg=q.calc?trailingSeg(entry):entry; if(seg.indexOf('.')===-1) entry+='.'; }
    else if(isOp(k)){ entry+=k; usedOp=true; }
    else { entry+=k; }
    paint();
  }
  function finish(ok,val,usedCalc){ if(done) return; done=true; try{ _onDone&&_onDone({ok:ok,value:val,usedCalc:usedCalc}); }catch(e){} }
  function doSubmit(){
    if(phase!=='answering') return;
    var val = q.calc ? evalExpr(entry) : (entry===''||entry==='-'?NaN:parseFloat(entry));
    if(!isFinite(val)){ nudge(); return; }
    phase='reveal'; try{ _onCommit&&_onCommit(); }catch(e){}
    submitBtn.style.display='none';
    var ok=judge(val), usedCalc=!!(q.calc&&usedOp);
    var ansStr=esc((q.pre||'')+trim(q.answer)+(q.post||''));
    if(ok){
      buzz(18);
      var tag = q.calc ? (usedOp?'Computed on the calculator (logged).':'Answered directly \u2014 no calc used (logged).') : 'Mental \u2014 no calculator (logged).';
      result.innerHTML='<div class="nm-strip ok">\u2713 Correct \u2014 <b>'+ansStr+'</b><span class="nm-lil">'+tag+'</span></div>';
      setTimeout(function(){ finish(ok,val,usedCalc); }, 1200);
    } else {
      buzz([30,50,30]); nudge();
      result.innerHTML='<div class="nm-strip bad">\u2715 Not quite \u2014 the answer is <b>'+ansStr+'</b><span class="nm-lil">'+esc(q.why||'')+'</span></div>';
      setTimeout(function(){ finish(ok,val,usedCalc); }, 1600);
    }
  }
  submitBtn.addEventListener('click', doSubmit);
  renderKeys(); paint();
}

function nmInjectCSS(){
  if(document.getElementById('nm-widget-css')) return;
  var css=document.createElement('style'); css.id='nm-widget-css';
  css.textContent=
  ".nm-mode{display:flex;align-items:center;justify-content:center;gap:7px;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:999px;width:fit-content;margin:0 auto 12px}"+
  ".nm-mode.calc{color:#39A7DE;border:1.5px solid rgba(57,167,222,.5);background:rgba(57,167,222,.09)}"+
  ".nm-mode.mental{color:#FFD34D;border:1.5px solid rgba(255,184,0,.5);background:rgba(255,184,0,.09)}"+
  ".nm-display{background:#0b1a2e;border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;min-height:58px;display:flex;align-items:center;justify-content:flex-end;gap:6px;font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(24px,8vw,32px);color:#fff;overflow-x:auto;white-space:nowrap;margin-bottom:12px}"+
  ".nm-display.nudge{animation:nm-nudge .3s ease}"+
  "@keyframes nm-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}"+
  ".nm-display .nm-ph{color:#8A97AD}.nm-display .nm-pre{color:#8A97AD}.nm-display .nm-unit{color:#8A97AD;font-size:.6em;align-self:center}"+
  ".nm-pad{display:grid;gap:8px}.nm-pad.calc{grid-template-columns:repeat(4,1fr)}.nm-pad.num{grid-template-columns:repeat(3,1fr);max-width:288px;margin:0 auto;width:100%}"+
  ".nm-key{font-family:'Archivo Black',sans-serif;font-size:22px;padding:15px 0;border-radius:13px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;transition:transform .07s,background .1s}"+
  ".nm-key:active{transform:translateY(3px);background:rgba(255,255,255,.14)}"+
  ".nm-key.op{color:#39A7DE;border-color:rgba(57,167,222,.4)}.nm-key.fn{color:#8A97AD;font-size:18px}"+
  ".nm-key.eq{background:linear-gradient(#FFD34D,#FFB800);color:#3a2600;border:none;box-shadow:0 4px 0 #8A5A00}"+
  ".nm-key.eq:active{transform:translateY(4px);box-shadow:0 0 0 #8A5A00}"+
  ".nm-submit{font-family:'Archivo Black',sans-serif;font-size:18px;letter-spacing:.05em;text-transform:uppercase;width:100%;padding:15px 0;border-radius:14px;border:none;background:linear-gradient(#FFD34D,#FFB800);color:#3a2600;box-shadow:0 5px 0 #8A5A00;cursor:pointer;margin-top:12px}"+
  ".nm-submit:active{transform:translateY(4px);box-shadow:0 1px 0 #8A5A00}"+
  ".nm-result{margin-top:10px}"+
  ".nm-strip{border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600;line-height:1.35}"+
  ".nm-strip.ok{background:rgba(22,164,110,.16);border:2px solid #16E08C;color:#CFF3E1}"+
  ".nm-strip.bad{background:rgba(255,77,41,.14);border:2px solid #FF4D29;color:#FFD9CF}"+
  ".nm-strip b{color:#fff}.nm-strip .nm-lil{display:block;margin-top:6px;font-size:12px;font-weight:600;color:#8A97AD}";
  document.head.appendChild(css);
}

/* ===== harness: 4 questions (2 mental, 2 method) ===== */
var BLOCK=[
  {type:'numeric', subject:'Maths', prompt:'7 \u00d7 8 = ?', answer:56, calc:false, pre:'', post:'', why:'7 \u00d7 8 = 56.'},
  {type:'numeric', subject:'Maths', prompt:'A rectangle is 12.5 cm by 8.4 cm. What is its area?', answer:105, calc:true, pre:'', post:' cm\u00b2', why:'Area = 12.5 \u00d7 8.4 = 105 cm\u00b2.'},
  {type:'numeric', subject:'Maths', prompt:'144 \u00f7 12 = ?', answer:12, calc:false, pre:'', post:'', why:'144 \u00f7 12 = 12.'},
  {type:'numeric', subject:'Maths', prompt:'An $80 jacket is reduced by 35%. Sale price?', answer:52, calc:true, pre:'$', post:'', why:'80 \u00d7 0.65 = $52.'}
];
var i=0, score=0;
function next(){
  if(i>=BLOCK.length){ document.getElementById('log').innerHTML='<b>Block complete</b> \u2014 score '+score+'/'+BLOCK.length+'.'; document.getElementById('mount').innerHTML=''; document.getElementById('qh').textContent=''; return; }
  document.getElementById('qn').textContent=i+1;
  document.getElementById('qh').textContent=BLOCK[i].prompt;
  mountNumeric(document.getElementById('mount'), BLOCK[i], function(res){
    if(res.ok){ score++; document.getElementById('score').textContent=score; }
    document.getElementById('log').innerHTML='Q'+(i+1)+': '+(res.ok?'<b>correct</b>':'wrong')+' (value '+res.value+', usedCalc='+res.usedCalc+') \u2192 onDone fired';
    i++; setTimeout(next, 600);
  });
}
next();
</script>
</body></html>
